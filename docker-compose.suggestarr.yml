# Optional SuggestArr recommendation automation. Enabled by the suggestarr
# Compose profile; all credentials are entered in SuggestArr's web wizard.
services:
  suggestarr:
    image: ${SUGGESTARR_IMAGE:-ciuse99/suggestarr:latest}
    profiles: [suggestarr]
    container_name: suggestarr
    restart: unless-stopped
    networks: [media-network]
    ports:
      - "${SUGGESTARR_PORT:-5000}:5000"
    environment:
      - SUGGESTARR_PORT=5000
      - LOG_LEVEL=${SUGGESTARR_LOG_LEVEL:-INFO}
      - TZ=${TZ:-UTC}
    volumes:
      - "${CONFIG_DIR}/suggestarr:/app/config/config_files"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
